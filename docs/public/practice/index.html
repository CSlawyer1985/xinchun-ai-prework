<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claude Code 命令打字练习 · 四明山法师 AI 夜校</title>
<style>
  /* ============================================================
     Claude Code 命令打字练习 · 工作版（qwerty 交互对齐）
     · 敲对自动进下一条（揭示卡停留 ~2s，空格跳过）
     · 错误键红字保持到敲对
     · 成功一闪 + 按键音效（可关）+ 深色模式
     强调色：Klein Blue #002FA7
     ============================================================ */
  :root {
    --bg: #f5f6f8;
    --canvas: #ffffff;
    --ink: #1a1d24;
    --label: #4a4f5a;
    --faint: #8b909c;
    --pending: #cfd3db;
    --line: #e3e6ec;
    --line-2: #d4d8e0;
    --row-alt: #f7f8fa;
    --accent: #002FA7;
    --accent-soft: #e6ebf7;
    --accent-ink: #0a1f6b;
    --ok: #1a1d24;
    --ok-glow: #1fa871;
    --err: #d64545;
    --err-soft: #fde8e8;
    --code-bg: #0f1330;
    --code-fg: #e6e9f7;
    --code-mut: #8b909c;
    --code-acc: #6ea8ff;
    --mono: 'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans: 'Inter',-apple-system,BlinkMacSystemFont,system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  }
  body[data-theme="dark"] {
    --bg: #0d1117;
    --canvas: #161b22;
    --ink: #e6e9f0;
    --label: #9aa3b2;
    --faint: #6b7480;
    --pending: #3a4150;
    --line: #232a35;
    --line-2: #2d3540;
    --row-alt: #1c232d;
    --accent: #5b82ff;
    --accent-soft: #1a2347;
    --accent-ink: #a8bcff;
    --ok: #e6e9f0;
    --ok-glow: #3ddc84;
    --err: #ff6b6b;
    --err-soft: #3a1f24;
    --code-bg: #0a0e22;
    --code-fg: #e6e9f7;
    --code-mut: #6b7480;
    --code-acc: #6ea8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html,body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    overflow: hidden; transition: background .2s, color .2s;
  }
  .app { display: flex; height: 100vh; }

  /* ---------- 侧栏 ---------- */
  .sidebar {
    width: 248px; flex-shrink: 0;
    border-right: 1px solid var(--line); background: var(--canvas);
    padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto; transition: background .2s, border-color .2s;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding-bottom: 4px; }
  .brand .logo { width: 22px; height: 22px; border-radius: 5px; background: var(--accent); position: relative; flex-shrink: 0; }
  .brand .logo::after { content:''; position:absolute; inset:5px; border:2px solid #fff; border-radius:2px; }
  .brand h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .brand h1 em { font-style: normal; color: var(--faint); font-weight: 400; font-size: 11px; display:block; letter-spacing: 0.02em; }
  .back-link { font: 11px var(--sans); color: var(--faint); text-decoration: none; letter-spacing: 0.02em; margin: -4px 2px 6px; padding: 3px 8px 3px 0; align-self: flex-start; transition: color .15s; }
  .back-link:hover { color: var(--accent); }

  .side-label { font: 9px/1 var(--mono); letter-spacing: 0.18em; color: var(--faint); text-transform: uppercase; }
  .chap-name { font-size: 12.5px; font-weight: 600; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  .progress-meta { font: 10px var(--mono); color: var(--faint); }

  .cmd-list { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
  .cmd-item {
    padding: 7px 10px; border-radius: 5px;
    font: 11.5px var(--mono); color: var(--faint);
    cursor: pointer; letter-spacing: 0.01em;
    border: 1px solid transparent;
    display: flex; align-items: center; gap: 8px;
    transition: background .12s;
  }
  .cmd-item .mk { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); flex-shrink: 0; }
  .cmd-item.done { color: var(--label); }
  .cmd-item.done .mk { background: var(--accent); }
  .cmd-item.now { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-soft); font-weight: 600; }
  .cmd-item.now .mk { background: var(--accent); }
  .cmd-item.wrong .mk { background: var(--err); }
  .cmd-item:hover { background: var(--row-alt); }

  .side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .wrong-box {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    display: flex; align-items: center; justify-content: space-between;
    font: 11px var(--mono); color: var(--label);
  }
  .wrong-box b { color: var(--err); font-weight: 600; }
  .ghost {
    height: 30px; padding: 0 13px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--canvas); font: 11px var(--mono); color: var(--label);
    cursor: pointer; letter-spacing: 0.02em; transition: background .12s;
  }
  .ghost:hover { background: var(--row-alt); }

  /* ---------- 主区 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .toolbar {
    height: 56px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 22px; gap: 6px;
    background: var(--canvas); transition: background .2s, border-color .2s;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    height: 30px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--canvas);
    font: 11.5px var(--mono); color: var(--label); letter-spacing: 0.02em;
    cursor: pointer; display: flex; align-items: center; gap: 7px; transition: all .12s;
  }
  .tab .n { font-size: 9px; color: var(--faint); }
  .tab:hover { background: var(--row-alt); }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab.on .n { color: rgba(255,255,255,.7); }
  .tb-spacer { flex: 1; }
  .icon-btn {
    width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--canvas); cursor: pointer; display: grid; place-items: center;
    color: var(--label); transition: background .12s, border-color .12s;
    font-size: 15px; line-height: 1;
  }
  .icon-btn:hover { background: var(--row-alt); }
  .icon-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* 命令显示区 */
  .center {
    flex: 1; position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 32px; gap: 26px;
  }
  .kicker {
    font: 10px/1 var(--mono); letter-spacing: 0.26em; color: var(--faint);
    text-transform: uppercase; display: flex; gap: 10px; align-items: center;
  }
  .kicker .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

  .cmd-line {
    font-family: var(--mono); font-weight: 600;
    font-size: clamp(32px, 5vw, 60px); line-height: 1.18;
    letter-spacing: -0.005em;
    user-select: none; text-align: center;
    padding: 4px 6px; transition: filter .15s;
  }
  .cmd-line.success { animation: okpop .3s ease; }
  @keyframes okpop {
    0%   { filter: none; }
    40%  { filter: drop-shadow(0 0 14px var(--ok-glow)); }
    100% { filter: none; }
  }
  .lt { color: var(--pending); transition: color .08s, background .08s, box-shadow .08s; border-radius: 3px; padding: 0 1px; }
  .lt.space { min-width: 0.34em; display: inline-block; }
  .lt.ok { color: var(--ok); }
  .lt.cur { color: var(--accent-ink); background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .lt.err { color: var(--err) !important; background: var(--err-soft) !important; box-shadow: inset 0 -2px 0 var(--err) !important; animation: shk .18s; }
  @keyframes shk { 0%,100%{transform:translateX(0)} 33%{transform:translateX(-2px)} 66%{transform:translateX(2px)} }

  .hint-row { font: 11px var(--mono); color: var(--faint); letter-spacing: 0.08em; display: flex; align-items: center; gap: 10px; min-height: 22px; }
  .kbd { border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 7px; font-size: 10px; color: var(--label); background: var(--canvas); }
  .hint-row.go { color: var(--accent); }

  /* 快捷键展示 */
  .combo-display { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .combo-display .plus { color: var(--faint); font: 600 12px var(--mono); }
  .keycap {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:44px; height:44px; padding:0 12px;
    border:1px solid var(--line-2); border-bottom-width:3px; border-radius:8px;
    background:var(--canvas); color:var(--ink);
    font:600 14px var(--mono); letter-spacing:0.02em;
    transition: transform .08s, border-color .12s, background .12s, color .12s;
  }
  .keycap.wide { padding:0 14px; }
  .combo-display.matched .keycap { border-color: var(--ok-glow); background: rgba(31,168,113,.12); color: var(--ok-glow); transform: translateY(-2px); }
  .combo-display.matched .plus { color: var(--ok-glow); }
  .combo-display.error .keycap { border-color: var(--err); background: var(--err-soft); color: var(--err); animation: shk .18s; }

  /* 答对揭示卡 */
  .reveal {
    position: absolute; left: 50%; transform: translateX(-50%) translateY(14px);
    bottom: 24px; width: min(740px, 90%); max-height: min(82vh, 680px); overflow-y: auto;
    border: 1px solid var(--accent); background: var(--canvas);
    border-radius: 10px; padding: 16px 18px 14px;
    box-shadow: 0 18px 48px -22px rgba(0,47,167,.45);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    display: flex; flex-direction: column; gap: 9px;
  }
  .reveal.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .reveal-tag {
    display: inline-block; align-self: flex-start; margin-bottom: 2px;
    background: var(--accent); color: #fff;
    font: 9px/1 var(--mono); letter-spacing: 0.16em; padding: 5px 9px; border-radius: 4px;
  }
  .rv-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 2px 0 8px; border-bottom: 1px solid var(--line); }
  .rv-name { font: 600 15px/1.35 var(--mono); color: var(--ink); word-break: break-all; }
  .rv-alias { font: 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
  .rv-alias:empty { display: none; }
  .rv-detail { font-size: 12.5px; line-height: 1.7; color: var(--label); }
  .rv-row { display: grid; grid-template-columns: 38px 1fr; gap: 4px; align-items: start; }
  .rv-k { font: 9px/1.7 var(--mono); letter-spacing: 0.16em; color: var(--faint); text-transform: uppercase; padding-top: 2px; }
  .rv-v { font-size: 13px; color: var(--ink); line-height: 1.55; }
  .rv-code {
    background: var(--code-bg); color: var(--code-fg);
    border-radius: 6px; padding: 8px 11px;
    font: 12px/1.6 var(--mono); letter-spacing: 0.01em; overflow-x: auto;
  }
  .rv-code .m { color: var(--code-mut); }
  .rv-code .a { color: var(--code-acc); }
  .rv-eff { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 7px 11px; border-radius: 0 5px 5px 0; font-size: 12.5px; color: var(--accent-ink); line-height: 1.55; }
  .reveal-next { position: absolute; bottom: 8px; right: 16px; font: 10px var(--mono); color: var(--faint); letter-spacing: 0.08em; }

  /* ---------- 右栏：命令详解（常驻默认显示） ---------- */
  .info-panel {
    width: 230px; flex-shrink: 0;
    border-left: 1px solid var(--line); background: var(--canvas);
    padding: 14px 14px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 9px;
    transition: background .2s, border-color .2s;
  }
  .ip-head { font: 9px/1 var(--mono); letter-spacing: 0.18em; color: var(--faint); text-transform: uppercase; padding-bottom: 4px; }

  /* 统计条 */
  .stats {
    height: 62px; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(5, 1fr); background: var(--canvas);
    transition: background .2s, border-color .2s;
  }
  .stat { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .stat:last-child { border-right: 0; }
  .stat-val { font: 600 18px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stat-val.acc { color: var(--accent); }
  .stat-lbl { font: 9px/1 var(--mono); color: var(--faint); letter-spacing: 0.16em; text-transform: uppercase; }

  .done-screen {
    position: absolute; inset: 0; background: var(--bg);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 50;
  }
  .done-screen.show { display: flex; }
  .done-screen h2 { font-size: 26px; font-weight: 600; }
  .done-screen p { font: 12px var(--mono); color: var(--faint); letter-spacing: 0.06em; }

  @media (max-width: 980px) {
    .info-panel { display: none; }
  }
  @media (max-width: 820px) {
    .sidebar { display: none; }
    .tab { padding: 0 10px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <h1>Claude Code 打字练习<em>命令 × 肌肉记忆</em></h1>
    </div>
    <a class="back-link" href="../" title="返回四明山法师 AI 夜校">← 返回夜校</a>
    <div class="side-label">当前章节</div>
    <div class="chap-name" id="chapName">CLI 命令</div>
    <div class="progress"><i id="progBar"></i></div>
    <div class="progress-meta"><span id="progTxt">0 / 0</span></div>
    <div class="side-label" style="margin-top:6px">命令列表</div>
    <div class="cmd-list" id="cmdList"></div>
    <div class="side-foot">
      <div class="wrong-box"><span>错题本</span><b><span id="wrongCnt">0</span> 条</b></div>
      <div class="ghost" id="resetBtn" style="justify-content:center;text-align:center;">重置当前类别进度</div>
    </div>
  </aside>

  <div class="main">
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="tb-spacer"></div>
      <div class="ghost" id="prevBtn" title="上一条">‹ 上一条</div>
      <div class="icon-btn" id="soundBtn" title="音效开关" style="font-family:var(--mono);font-size:13px">♪</div>
      <div class="icon-btn" id="themeBtn" title="深色模式" style="font-size:14px">◐</div>
    </div>

    <div class="center">
      <div class="kicker"><span class="dot"></span><span id="kickerTxt">CLI · 01 / 09</span></div>
      <div class="cmd-line" id="cmdLine"></div>
      <div class="hint-row" id="hintRow"></div>

      <div class="done-screen" id="doneScreen">
        <h2>本章全部完成</h2>
        <p id="doneStats">—</p>
        <div class="ghost" id="restartBtn" style="margin-top:8px">重新练习本章</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-val" id="sTime">00:00</div><div class="stat-lbl">时间</div></div>
      <div class="stat"><div class="stat-val" id="sInput">0</div><div class="stat-lbl">输入数</div></div>
      <div class="stat"><div class="stat-val" id="sWpm">0</div><div class="stat-lbl">WPM</div></div>
      <div class="stat"><div class="stat-val" id="sCorrect">0</div><div class="stat-lbl">正确数</div></div>
      <div class="stat"><div class="stat-val acc" id="sAcc">100%</div><div class="stat-lbl">正确率</div></div>
    </div>
  </div>

  <aside class="info-panel" id="infoPanel" data-od-id="info-panel">
    <div class="ip-head">命令详解 · 常驻显示</div>
    <div class="rv-head"><span class="rv-name" id="rvName"></span><span class="rv-alias" id="rvAlias"></span></div>
    <div class="rv-row"><div class="rv-k">说明</div><div class="rv-v" id="rvDesc"></div></div>
    <div class="rv-row"><div class="rv-k">详解</div><div class="rv-v rv-detail" id="rvDetail"></div></div>
    <div class="rv-row"><div class="rv-k">场景</div><div class="rv-v" id="rvWhen"></div></div>
    <div class="rv-row"><div class="rv-k">示例</div><div class="rv-code" id="rvCode"></div></div>
    <div class="rv-row"><div class="rv-k">效果</div><div class="rv-eff" id="rvEff"></div></div>
    <div class="rv-row"><div class="rv-k">贴士</div><div class="rv-v" id="rvTip"></div></div>
  </aside>
</div>

<script>
/* ============================================================ 命令数据 ============================================================ */
const DATA = {
  CLI: { title: 'CLI 命令 · 终端启动与子命令', items: [
    { name:'claude',          desc:'启动交互式会话（REPL）',        ex:'claude',                            eff:'进入终端对话界面，等待提问' },
    { name:'claude -p',       desc:'打印模式：单次提示后退出',      ex:'claude -p "解释这段代码"',          eff:'非交互运行，输出即退出，适合脚本' },
    { name:'claude -c',       desc:'继续当前目录最近会话',          ex:'claude -c',                         eff:'-c 是 --continue 缩写，接续上次对话' },
    { name:'claude -r',       desc:'按 ID 或名称恢复会话',          ex:'claude -r auth-refactor',           eff:'-r 是 --resume 缩写；不带参数弹选择器' },
    { name:'claude --model',  desc:'指定本次会话模型',              ex:'claude --model sonnet',             eff:'覆盖配置与 ANTHROPIC_MODEL 环境变量' },
    { name:'claude --fallback-model', desc:'主模型不可用时的备选链', ex:'claude --fallback-model sonnet,haiku', eff:'按顺序尝试，最多 3 级' },
    { name:'claude mcp',      desc:'管理 MCP 服务器',               ex:'claude mcp list',                   eff:'查看 / 添加 / 删除 MCP 连接' },
    { name:'claude mcp login',desc:'命令行跑 MCP OAuth 流',         ex:'claude mcp login sentry',           eff:'不打开 /mcp 面板，适合脚本' },
    { name:'claude config',   desc:'查看与设置配置项',              ex:'claude config set -g model opus',   eff:'-g 用户级；影响后续所有会话' },
    { name:'claude update',   desc:'更新到最新版',                  ex:'claude update',                     eff:'自更新二进制，无需手动重装' },
    { name:'claude doctor',   desc:'诊断安装与配置健康',            ex:'claude doctor',                     eff:'检查版本/网络/认证/权限，只读不修' },
    { name:'claude auth login',  desc:'登录 Anthropic 账户',        ex:'claude auth login --console',       eff:'--console 走 API 计费，--sso 强制单点' },
    { name:'claude auth status', desc:'查看登录状态（JSON）',       ex:'claude auth status',                eff:'已登录退出码 0，未登录退出码 1' },
    { name:'claude agents',   desc:'打开后台会话视图',              ex:'claude agents --json',              eff:'监控并并行调度多个后台 session' },
    { name:'claude setup-token', desc:'生成 CI 长效 OAuth token',   ex:'claude setup-token',                eff:'打印到终端不保存，需订阅' },
    { name:'claude install',  desc:'安装或重装原生二进制',          ex:'claude install stable',             eff:'可指定版本号、stable 或 latest' },
    { name:'claude --add-dir',desc:'为本会话追加工作目录',          ex:'claude --add-dir ../lib',           eff:'授予文件读写权限；持久化走 permissions' },
    { name:'claude --dangerously-skip-permissions', desc:'跳过全部权限确认（危险）', ex:'claude --dangerously-skip-permissions', eff:'等同 --permission-mode bypassPermissions' },
    { name:'claude -v',       desc:'查看版本号',                    ex:'claude -v',                         eff:'打印当前版本并退出' },
  ]},
  Slash: { title: '斜杠命令 · 会话内操作', items: [
    { name:'/init',           desc:'初始化项目记忆',         ex:'/init',           eff:'扫描代码库，生成 CLAUDE.md' },
    { name:'/clear',          desc:'清空对话上下文',         ex:'/clear',          eff:'别名 /reset /new；释放 token' },

/* ============================================================ 状态 ============================================================ */
const STORE = 'cc-typing-v1';
const REVEAL_DWELL = 2200;   // 揭示卡停留毫秒（qwerty 式自动进位）
let cat = 'CLI';
let idx = 0;
let pos = 0;
let started = false;
let startTime = 0;
let timerInt = null;
let totalKeys = 0;
let correctKeys = 0;
let cmdHadError = false;
let completed = false;       // 当前命令已答对，处于揭示停留窗口
let revealTimer = null;
let wrongSet = new Set();
let progress = loadProgress();
let soundOn = (localStorage.getItem(STORE + ':sound') ?? '1') === '1';
let theme = localStorage.getItem(STORE + ':theme') || 'light';
let audioCtx = null;
let lastKey = '', lastKeyTime = 0;   // 双击键序列判定（如 Esc Esc）

/* ============================================================ 持久化 ============================================================ */
function loadProgress() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE) || '{}');
    const p = {};
    Object.keys(DATA).forEach(k => { p[k] = Array.isArray(raw.done?.[k]) ? new Set(raw.done[k]) : new Set(); });
    wrongSet = new Set(Array.isArray(raw.wrong) ? raw.wrong : []);
    return p;
  } catch(e) { const p={}; Object.keys(DATA).forEach(k=>p[k]=new Set()); return p; }
}
function saveProgress() {
  const done = {};
  Object.keys(progress).forEach(k => done[k] = [...progress[k]]);
  try { localStorage.setItem(STORE, JSON.stringify({ done, wrong: [...wrongSet] })); } catch(e) {}
}

/* ============================================================ 音效（Web Audio） ============================================================ */
function beep(freq, dur, type='sine', vol=0.05) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur);
  } catch(e) {}
}
const sfx = {
  ok:    () => beep(720, 0.04, 'sine', 0.025),
  err:   () => beep(160, 0.13, 'square', 0.04),
  done:  () => { beep(660,0.10,'sine',0.04); setTimeout(()=>beep(990,0.13,'sine',0.04),90); },
};

/* ============================================================ 渲染 ============================================================ */
const $ = id => document.getElementById(id);
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function highlightCode(s){
  return escapeHtml(s)
    .replace(/&lt;[^&]+?&gt;/g, m => `<span class="a">${m}</span>`)
    .replace(/(&quot;[^&]*?&quot;)/g, m => `<span class="a">${m}</span>`);
}

function renderTabs() {
  $('tabs').innerHTML = Object.keys(DATA).map(k => {
    const lbl = k === 'Subagent' ? '工具' : (k === 'Config' ? '配置' : (k === 'Shortcut' ? '快捷键' : (k === 'Vim' ? 'Vim' : k)));
    return `<div class="tab ${k===cat?'on':''}" data-cat="${k}">${lbl} <span class="n">${DATA[k].items.length}</span></div>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => switchCategory(t.dataset.cat));
}

function renderSidebar() {
  const items = DATA[cat].items;
  $('chapName').textContent = DATA[cat].title;
  $('cmdList').innerHTML = items.map((it, i) => {
    const cls = i === idx ? 'now' : (progress[cat].has(i) ? 'done' : '');
    const wcls = wrongSet.has(cat + ':' + i) ? 'wrong' : '';
    return `<div class="cmd-item ${cls} ${wcls}" data-i="${i}"><span class="mk"></span>${escapeHtml(it.name)}</div>`;
  }).join('');
  $('cmdList').querySelectorAll('.cmd-item').forEach(el => el.onclick = () => { idx = +el.dataset.i; resetCommand(); renderAll(); });
  const done = progress[cat].size, total = items.length;
  $('progBar').style.width = (done / total * 100) + '%';
  $('progTxt').textContent = `${done} / ${total} · ${Math.round(done/total*100)}%`;
  $('wrongCnt').textContent = wrongSet.size;
}

function renderCommand() {
  const it = DATA[cat].items[idx];
  if (DATA[cat].mode === 'shortcut') return renderShortcut();
  const chars = [...it.name];
  $('cmdLine').innerHTML = chars.map((ch, i) => {
    const space = ch === ' ' ? ' space' : '';
    let cls = 'lt' + space;
    if (i < pos) cls += ' ok';
    else if (i === pos && !completed) cls += ' cur';
    else if (i <= pos && completed) cls += ' ok';
    return `<span class="${cls}">${ch === ' ' ? ' ' : escapeHtml(ch)}</span>`;
  }).join('');
  $('kickerTxt').textContent = `${cat} · ${pad(idx+1)} / ${pad(DATA[cat].items.length)}`;
  if (!started) {
    $('hintRow').innerHTML = `<span class="kbd">任意键</span> 开始 · <span class="kbd">Tab</span> 跳过 · <span class="kbd">Esc</span> 重置`;
    $('hintRow').classList.remove('go');
  } else {
    $('hintRow').innerHTML = `<span class="kbd">Tab</span> 跳过 · <span class="kbd">Esc</span> 重置 · 敲对自动下一条`;
    $('hintRow').classList.remove('go');
  }
}

function renderShortcut() {
  const it = DATA[cat].items[idx];
  const groups = it.name.split(' ').map(seg => seg.split('+'));
  let html = '';
  groups.forEach((g, gi) => {
    if (gi > 0) html += `<span class="plus">→</span>`;
    g.forEach((k, ki) => {
      if (ki > 0) html += `<span class="plus">+</span>`;
      const wide = k.length > 2 ? ' wide' : '';
      html += `<span class="keycap${wide}">${escapeHtml(k)}</span>`;
    });
  });
  $('cmdLine').innerHTML = `<div class="combo-display" id="comboDisp">${html}</div>`;
  $('kickerTxt').textContent = `${cat} · ${pad(idx+1)} / ${pad(DATA[cat].items.length)}`;
  const hint = '按下 ' + it.name + ' 通过';
  $('hintRow').innerHTML = `${hint} · <span class="kbd">Tab</span> 跳过`;
  $('hintRow').classList.remove('go');
}

function renderStats() {
  const elapsed = started ? (Date.now() - startTime) / 1000 : 0;
  $('sTime').textContent = `${pad(Math.floor(elapsed/60))}:${pad(Math.floor(elapsed%60))}`;
  $('sInput').textContent = totalKeys;
  $('sCorrect').textContent = correctKeys;
  $('sWpm').textContent = elapsed > 0 ? Math.round((correctKeys/5)/(elapsed/60)) : 0;
  $('sAcc').textContent = (totalKeys > 0 ? Math.round(correctKeys/totalKeys*100) : 100) + '%';
}

function renderInfo(){
  const it = DATA[cat].items[idx];
  if (DATA[cat].mode === 'shortcut') {
    $('rvName').textContent = it.name;
    $('rvAlias').textContent = it.combo.double ? '双击键' : (it.combo.ctrl ? 'Ctrl 组合' : (it.combo.alt ? 'Alt/Option' : (it.combo.shift ? 'Shift 组合' : '单键')));
    $('rvDesc').textContent = it.desc;
    $('rvDetail').textContent = '';
    $('rvWhen').textContent = '';
    $('rvCode').textContent = '';
    $('rvEff').textContent = it.eff;
    $('rvTip').textContent = it.combo.alt ? 'macOS 需在终端配置 Option as Meta' : '在真实终端会话中按下此组合键即可触发';
    return;
  }

  const r = RICH[it.name] || {};
  $('rvName').textContent = it.name;
  $('rvAlias').textContent = r.alias ? ('别名 ' + r.alias) : '';
  $('rvDesc').textContent = it.desc;
  $('rvDetail').textContent = DETAIL[it.name] || '';
  $('rvWhen').textContent = r.when || '';
  $('rvCode').innerHTML = highlightCode(it.ex);
  $('rvEff').textContent = it.eff;
  $('rvTip').textContent = r.tip || '';
}
function renderAll(){ renderTabs(); renderSidebar(); renderCommand(); renderStats(); renderInfo(); }

/* ============================================================ 引擎（qwerty 交互） ============================================================ */
function resetCommand() {
  pos = 0; completed = false; cmdHadError = false;
  clearTimeout(revealTimer); revealTimer = null;
  $('cmdLine').classList.remove('success');
}

function startTimer() {
  if (started) return;
  started = true; startTime = Date.now();
  timerInt = setInterval(renderStats, 200);
}
function stopTimer(){ if (timerInt){ clearInterval(timerInt); timerInt = null; } }
function resetStats(){ started = false; stopTimer(); totalKeys = 0; correctKeys = 0; renderStats(); }

function completeCommand() {
  sfx.done();
  progress[cat].add(idx);
  if (cmdHadError) wrongSet.add(cat + ':' + idx); else wrongSet.delete(cat + ':' + idx);
  saveProgress();
  renderSidebar();
  // 自动切下一条：详解常驻右栏，不用空格；末条则弹结算屏
  if (idx >= DATA[cat].items.length - 1) { showDoneScreen(); return; }
  idx++;
  resetCommand();
  renderAll();                 // 渲染下一条命令字母 + 更新右栏详解
  $('cmdLine').classList.add('success');   // 切换时给新命令行闪一道绿光作完成提示
  setTimeout(() => $('cmdLine').classList.remove('success'), 320);
}

function nextCommand() {
  clearTimeout(revealTimer); revealTimer = null;
  if (idx < DATA[cat].items.length - 1) { idx++; resetCommand(); renderAll(); }
  else showDoneScreen();
}
function prevCommand() { if (idx > 0) { idx--; resetCommand(); renderAll(); } }

function showDoneScreen() {
  clearTimeout(revealTimer);
  const elapsed = started ? (Date.now() - startTime) / 1000 : 0;
  const acc = totalKeys > 0 ? Math.round(correctKeys/totalKeys*100) : 100;
  const wpm = elapsed > 0 ? Math.round((correctKeys/5)/(elapsed/60)) : 0;
  const wcount = [...wrongSet].filter(x => x.startsWith(cat+':')).length;
  $('doneStats').textContent = `用时 ${Math.floor(elapsed/60)}m${Math.floor(elapsed%60)}s · WPM ${wpm} · 正确率 ${acc}% · 错题 ${wcount} 条`;
  $('doneScreen').classList.add('show');
}

function switchCategory(c){ if (c === cat) return; cat = c; idx = 0; resetCommand(); resetStats(); renderAll(); }

function resetCategory() {
  progress[cat].clear();
  [...wrongSet].forEach(x => { if (x.startsWith(cat+':')) wrongSet.delete(x); });
  idx = 0; resetCommand(); resetStats(); saveProgress(); renderAll();
}

/* ============================================================ 键盘处理 ============================================================ */
function onKey(e) {
  // window+document 双监听防重入：capture 阶段同一事件会先经 Window 再经 Document，
  // 不拦的话 onKey 触发两次 → 第 2 次 pos 已进位，命中下一字符被误判错误（全错题本 bug 根因）
  if (e.__ccHandled) return;
  e.__ccHandled = true;
  if (DATA[cat].mode === 'shortcut') return onShortcutKey(e);
  if (e.key === 'Escape') { e.preventDefault(); resetCommand(); renderAll(); return; }
  if (e.key === 'Tab') { e.preventDefault(); cmdHadError = true; sfx.err(); nextCommand(); return; }
  if (e.key.length !== 1 && e.key !== ' ') return;   // 仅处理可打印字符
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  e.preventDefault();
  startTimer();

  const chars = [...DATA[cat].items[idx].name];
  const expected = chars[pos];
  const key = e.key;

  totalKeys++;
  if (key === expected) {
    correctKeys++;
    pos++;
    sfx.ok();
    if (pos >= chars.length) { completeCommand(); return; }
    renderCommand();
  } else {
    // 错误键：当前字母红字保持到敲对（不重建 DOM、不计时清除——qwerty 行为）
    cmdHadError = true;
    sfx.err();
    const cur = $('cmdLine').querySelectorAll('.lt')[pos];
    if (cur) {
      cur.classList.remove('err');           // 重启抖动动画
      void cur.offsetWidth;
      cur.classList.add('err');
    }
  }
  renderStats();
}

/* ============================================================ 绑定 ============================================================ */
/* ---------- 快捷键模式：组合键判定 ---------- */
function onShortcutKey(e) {
  const it = DATA[cat].items[idx];
  const c = it.combo;
  if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
    e.preventDefault(); cmdHadError = true; sfx.err(); nextCommand(); return;
  }
  if (['Shift','Control','Alt','Meta'].includes(e.key)) return;
  e.preventDefault();
  startTimer();
  const ctrl = e.ctrlKey || e.metaKey, alt = e.altKey, shift = e.shiftKey, key = e.key;
  let matched = false;
  if (c.double) {
    if (key === c.key) {
      const now = Date.now();
      if (lastKey === c.key && (now - lastKeyTime) < 500) { matched = true; lastKey = ''; lastKeyTime = 0; }
      else { lastKey = key; lastKeyTime = now; }
    } else { lastKey = ''; lastKeyTime = 0; }
  } else if (c.seq) {
    if (lastKey === c.seq[0] && key === c.seq[1] && lastKeyTime && (Date.now() - lastKeyTime) < 1000) {
      matched = true; lastKey = ''; lastKeyTime = 0;
    } else if (key === c.seq[0]) {
      lastKey = key; lastKeyTime = Date.now();
    } else { lastKey = ''; lastKeyTime = 0; }
  } else {
    matched = (ctrl === !!c.ctrl && alt === !!c.alt && shift === !!c.shift &&
               key.toLowerCase() === String(c.key || '').toLowerCase());
  }
  const disp = $('comboDisp');
  if (matched) {
    totalKeys++; correctKeys++; sfx.ok();
    if (disp) { disp.classList.remove('error'); disp.classList.add('matched'); }
    setTimeout(() => { completeCommand(); }, 240);
  } else {
    if (ctrl || alt || shift || c.double || ['Escape','Enter','Backspace','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) {
      totalKeys++; cmdHadError = true; sfx.err();
      if (disp) { disp.classList.remove('matched'); void disp.offsetWidth; disp.classList.add('error'); }
    }
  }
  renderStats();
}


window.addEventListener('keydown', onKey, true);
document.addEventListener('keydown', onKey, true);
document.body.setAttribute('tabindex','-1');
document.body.style.outline = 'none';
window.addEventListener('load', () => { try { window.focus(); document.body.focus({preventScroll:true}); } catch(e){} });

$('prevBtn').onclick = prevCommand;
$('resetBtn').onclick = resetCategory;
$('restartBtn').onclick = () => { $('doneScreen').classList.remove('show'); resetCategory(); };

$('soundBtn').onclick = () => {
  soundOn = !soundOn;
  localStorage.setItem(STORE + ':sound', soundOn ? '1' : '0');
  $('soundBtn').classList.toggle('on', soundOn);
  $('soundBtn').style.opacity = soundOn ? '1' : '.4';
  if (soundOn) sfx.ok();
};
$('themeBtn').onclick = () => {
  theme = theme === 'light' ? 'dark' : 'light';
  localStorage.setItem(STORE + ':theme', theme);
  applyTheme();
};
function applyTheme() {
  document.body.setAttribute('data-theme', theme);
  $('themeBtn').classList.toggle('on', theme === 'dark');
}

/* 初始 */
applyTheme();
$('soundBtn').classList.toggle('on', soundOn);
$('soundBtn').style.opacity = soundOn ? '1' : '.4';
renderAll();
</script>
