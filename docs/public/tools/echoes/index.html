<style>
:root{--bg:#121212;--bg2:#1a1917;--ink:#e9e4d8;--mute:#9a9486;--line:#34312b;--now:#d2343c;--past:#f2eee6;--paper:#f3eee3;

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.05;

a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.hero{position:relative;height:100vh;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#22201c 0%,#121212 70%)}
.field{position:absolute;inset:0}
.cap{position:absolute;left:0;top:0;width:58px;height:22px;border-radius:11px;display:flex;cursor:pointer;border:0;padding:0;background:none;

.cap i{flex:1;display:block;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s}

.cap.open i:first-child{transform:translateX(-26px) rotate(-28deg);opacity:0}
.cap.open i:last-child{transform:translateX(26px) rotate(28deg);opacity:0}
.cap.open::after{opacity:0}
.dot.past{box-shadow:inset 0 0 0 1px #999}
.hero-text{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 20px}
.kicker{letter-spacing:.3em;font-size:12px;color:var(--mute);margin:0 0 18px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(48px,9vw,112px);letter-spacing:.12em;margin:0;line-height:1.1;text-shadow:0 2px 30px rgba(0,0,0,.8)}
.slogan{font-family:var(--serif);font-size:clamp(17px,2.2vw,24px);letter-spacing:.35em;color:#cfc6b2;margin:22px 0 28px}
.legend{font-size:13px;color:var(--mute);display:flex;gap:10px;align-items:center;background:rgba(18,18,18,.6);padding:6px 14px;border-radius:20px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.now{background:var(--now)}.dot.past{background:var(--past)}
.hint{margin-left:8px;opacity:.7}
.scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;font-size:12px;letter-spacing:.3em;color:var(--mute);text-decoration:none}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--paper);color:#222;font-size:13px;padding:5px 10px;border-radius:4px;white-space:nowrap;opacity:0;transform:translate(-50%,-130%);transition:opacity .2s}
.tip b{color:#8a5a12;margin-right:6px}
.sec-title{font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:.15em;margin:110px 0 30px;text-align:center}
.intro{max-width:760px;padding-top:90px;font-family:var(--serif);font-size:17px;color:#d6cfbf}
.intro .callout{border-left:2px solid var(--now);padding:4px 0 4px 20px;margin-top:24px;color:var(--ink)}
.axis-head{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:13px;letter-spacing:.3em}
.now-c{color:var(--now)}.past-c{color:var(--past)}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 40px}
.filters button{font:inherit;font-size:14px;background:none;color:var(--mute);border:1px solid var(--line);padding:5px 16px;border-radius:20px;cursor:pointer;transition:.2s}
.filters button:hover{color:var(--ink);border-color:#5a554b}
.filters button.on{background:var(--ink);color:#141414;border-color:var(--ink)}
.group{margin-bottom:60px}
.group h3{font-family:var(--serif);text-align:center;font-weight:600;font-size:20px;letter-spacing:.3em;margin:0 0 24px;color:#cfc6b2}
.group h3 small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--mute);font-weight:400}
.rows{position:relative}
.rows::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(var(--line),var(--line) 90%,transparent)}
.row{display:grid;grid-template-columns:1fr 56px 1fr;align-items:start;margin-bottom:22px}
.node{justify-self:center;margin-top:16px;width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid #4a463e;font-size:12px;display:grid;place-items:center;color:var(--mute);position:relative;z-index:1}
.side{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer;transition:border-color .25s,transform .25s}
.side:hover{transform:translateY(-2px)}
.side.now{border-top:2px solid var(--now);text-align:right}
.side .x{display:none;margin-top:12px;padding-top:10px;border-top:1px dashed #3d3a33;text-align:left;font-size:13px;color:#c2bbab}
.side.ex .x{display:block;animation:fade .35s}.side .x dt{color:var(--mute);font-size:11px;letter-spacing:.2em;margin-top:8px}.side .x dd{margin:2px 0 0}.side .x a{color:#e7a0a4;word-break:break-all}.side.past .x a{color:#cfd8dc}
.side .tg{font-size:11px;color:var(--mute);margin-top:6px}.side .tg::after{content:"展开 ▾"}.side.ex .tg::after{content:"收起 ▴"}.side:hover{transform:none}
.node{cursor:pointer}.node:hover{border-color:var(--now);color:var(--ink)}.side.past{border-top:2px solid var(--past)}
.row:hover .side.now{border-color:var(--now)}.row:hover .side.past{border-color:var(--past)}
.side .t{font-family:var(--serif);font-size:16px;line-height:1.6}
.side .m{font-size:12px;color:var(--mute);margin-top:6px}
.badge{display:inline-block;font-size:11px;padding:0 7px;border-radius:3px;border:1px solid currentColor;margin:0 2px;line-height:18px;white-space:nowrap}
.b-strong{color:#a9c98a}.b-mid{color:#c9b88a}.s-ok{color:#a9c98a}.s-dis{color:#d79a7a}.s-part{color:#c9b88a}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
.laws{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;counter-reset:l}
.laws li{counter-increment:l;background:var(--bg2);border:1px solid var(--line);padding:22px;border-radius:6px}
.laws li::before{content:counter(l,cjk-ideographic);font-family:var(--serif);color:var(--now);font-size:14px;letter-spacing:.2em}
.laws h4{font-family:var(--serif);font-size:19px;margin:6px 0 8px;font-weight:600}
.laws p{margin:0;color:#c2bbab;font-size:14px}
.quote{font-family:var(--serif);font-size:26px;text-align:center;margin:60px auto 0;letter-spacing:.2em}
.quote cite{display:block;font-size:12px;letter-spacing:.1em;color:var(--mute);font-style:normal;margin-top:10px;font-family:var(--sans)}
.method{font-size:14px;color:#b8b1a2;max-width:820px;margin:0 auto}
.method .key{border:1px solid var(--line);padding:14px 18px;border-radius:6px;color:var(--ink)}
.method p{margin:0 0 16px}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:80px 24px 50px;letter-spacing:.2em}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(8,8,8,.72);backdrop-filter:blur(6px);animation:fade .35s}
.card{position:relative;width:min(1040px,100%);max-height:90vh;overflow:auto;background:var(--paper);color:#262420;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .5s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
.card header{padding:22px 28px 14px;border-bottom:1px solid #d8d0bf;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.card header .meta{font-size:12px;color:#7b7366;letter-spacing:.1em}
.card h2{font-family:var(--serif);font-size:22px;margin:4px 0 0;font-weight:600}
.close{font:inherit;background:none;border:1px solid #bdb4a2;border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.cols{display:grid;grid-template-columns:1fr 1fr}
.col{padding:22px 28px}
.col.now{border-right:1px solid #d8d0bf;background:linear-gradient(90deg,rgba(210,52,60,.07),transparent)}
.col.past{background:linear-gradient(270deg,rgba(0,0,0,.025),transparent)}
.col h3{font-size:12px;letter-spacing:.3em;margin:0 0 8px}
.col.now h3{color:#b0262e}.col.past h3{color:#6b655a}
.col .big{font-family:var(--serif);font-size:19px;line-height:1.55;margin:0 0 14px;font-weight:600}
dl{margin:0}dt{font-size:12px;color:#7b7366;letter-spacing:.15em;margin-top:12px}dd{margin:2px 0 0;font-size:15px}
.ev{margin-top:16px;padding:12px 14px;background:rgba(0,0,0,.04);border-radius:4px;font-size:13px;color:#4a453c}
.ev .lab{font-size:11px;letter-spacing:.15em;color:#7b7366;display:block;margin-bottom:4px}
.src{display:inline-block;margin-top:12px;font-size:13px;word-break:break-all;color:#2f5f8a}
.compare{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #d8d0bf}
.compare div{padding:18px 28px;border-right:1px solid #d8d0bf}.compare div:last-child{border:0}
.compare h4{margin:0 0 6px;font-size:12px;letter-spacing:.3em;color:#7b7366}
.compare p{margin:0;font-size:15px}
.compare .lesson{background:#2a2723;color:var(--paper)}.compare .lesson h4{color:#f0646a}
.card .badge{font-size:11px}.card .b-strong,.card .s-ok{color:#4f7a2c}.card .b-mid,.card .s-part{color:#8a6a1a}.card .s-dis{color:#a24f2a}

@media (max-width:760px){
 .wrap{padding:0 16px}
 .cap{width:42px;height:16px;border-radius:8px}.cap i:first-child{border-radius:8px 0 0 8px}.cap i:last-child{border-radius:0 8px 8px 0}.cap::after{top:3px;height:3px}
 .slogan{letter-spacing:.2em}.legend{flex-wrap:wrap;justify-content:center}
 .axis-head{display:none}
 .rows::before{left:16px}
 .row{grid-template-columns:34px 1fr;gap:10px 12px}
 .node{grid-row:1/3;margin-top:8px;align-self:start}
 .side.now{text-align:left}
 .side.past{grid-column:2}
 .side::before{display:block;font-size:11px;letter-spacing:.3em;margin-bottom:4px}.side.now::before{content:"今日";color:var(--now)}.side.past::before{content:"历史";color:var(--past)}
 .cols,.compare{grid-template-columns:1fr}
 .col.now{border-right:0;border-bottom:1px solid #d8d0bf}
 .compare div{border-right:0;border-bottom:1px solid #d8d0bf}
 .card{max-height:92vh}.card header,.col,.compare div{padding-left:18px;padding-right:18px}
 .sec-title{margin-top:80px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.card,.backdrop{animation:none}}

</style>
</head>

  "第六轮（2026年11月2日，北京时间）：按用户决定，删除今日侧或历史侧证据为“弱”的7条，即原第1条（早期汽车恐惧）、第2条（计算机扫盲焦虑）、第10条（学徒制瓦解）、第28条（技术万能论）、第29条（AGI预言与AI寒冬）、第30条（“地球村”幻想，含1858年电缆“世界和平”说法）、第41条（新职业涌现）。同时删去站不住的说法：第11条中苏联修改照片的例子；第30条（英国首例汽车撞人致死）中验尸官“永不再发生”的引语，该引语在1896年验尸报道中找不到。删除后剩42条，已重新编号。本节以下各轮说明中的条目编号均已改为新编号，已删条目注明“原”。",
  "第五轮（2026年11月2日，北京时间）：把只靠维基或博客支撑的条目换成原始或权威来源，涉及第11、13、24、26、29、30、31、34条（以及已删的原第30、41条）。纠正第39条，“AI不是writer”出自合同备忘录，摘要页的原话为“AI can’t write or rewrite literary material”。纠正第42条，CNBC原文为“close to $600 billion”。核实第2条和解撤诉、第9条约翰逊委员会。证据研究（第四轮，2026年11月2日，北京时间）：新增第39至42条，包括编剧罢工、最高法AI司法意见、AI招聘歧视和DeepSeek冲击；AI陪伴与FTC调查并入第2条，AI虚构判例的最新统计并入第18条。“AI羞耻感”有调查数据（WalkMe 2025年调查称48.8%的人隐瞒使用AI，来自检索摘要），但没有找到可靠的历史押韵事件，暂不收录。证据强度分三级：强指官方文件、法规、判决、同行评审论文或档案馆资料；中指权威媒体或二手学术；弱指维基、博客或个人观点。摘录前的标记表示获取方式：【原文已打开】为本轮用WebFetch打开原页面核对；【检索到原文片段】为搜索结果中出现的原文文字；【检索确认】和【仅摘要】为只依据搜索摘要。本轮用WebFetch打开的原文共14页：Pew、英国国家档案馆、美国国家档案馆、凯恩斯原文、NRC、Quote Investigator、索洛出处考证、CNBC、NPR、国家铁路博物馆之友会、中国政府网、FDA、Griggs判决，以及1954年参议院漫画听证页（返回404，已放弃该对照）。",
  "核实情况（第六轮删除后，42条）：已核实·含争议5条（14、22、23、34、35），部分核实5条（1、11、24、26、29），其余32条为已核实。第三轮曾更正：#7的DOI改为…00408，并删除“改回原名”；#14补充1878年和1896年的条文；#23修正铁路法案数量与股价下跌的时间线；#3补充1930年的“音乐保卫联盟”；另新增#36–38。“部分核实”指只通过搜索摘要或二手资料确认、没有打开原始文献的条目。以下为第二轮说明：已联网逐一检测全部来源链接。失效或指向首页的8条已替换为具体页面，包括第2、4、8、18、21、23、27条（及已删的原第30条）。第4条1986年计算器抗议已按《华盛顿邮报》当时的报道更正；第18条的历史对照已改为可查证的电报合同判例；第5条已补充Klarna重新雇用人工客服和NBER研究的具体结论。新增第29至35条（及已删的原第41条）。Pew、微软、《纽约时报》、SEC、IMF、DOI等链接对自动检测返回403，属于网站拦截机器访问，SEC、NBER、NYT 2011年报道的内容已通过搜索交叉确认。仍存疑或有争议的内容：第14条红旗法案是否拖累英国汽车业；第22条斯宾汉姆兰制度的效果；第23、35条AI是否构成泡沫；第34条火车进站传说；“历史会押韵”的出处。"
 ]
};

</script>
<script>
(function(){
const D=window.ECHOES,items=D.items,$=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const evB=v=>`<span class="badge ${v==='强'?'b-strong':'b-mid'}">证据${esc(v)}</span>`;
const stB=s=>`<span class="badge ${s==='已核实'?'s-ok':s.includes('争议')?'s-dis':'s-part'}">${esc(s)}</span>`;
const link=u=>u?`<a class="src" href="${esc(u)}" target="_blank" rel="noopener">来源：${esc(u.replace(/^https?:\/\//,'').slice(0,70))}${u.length>78?'…':''}</a>`:'';

/* intro */
$('#intro').innerHTML=(D.summary?`<p>${esc(D.summary)}</p>`:'')+D.overview.map((t,i)=>`<p class="${i===D.overview.length-1?'callout':''}">${esc(t)}</p>`).join('');

/* capsules */
const field=$('#field'),tip=$('#tip'),hero=$('#hero');let W,H;const caps=[];
function size(){W=hero.clientWidth;H=hero.clientHeight;}size();addEventListener('resize',size);
let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const all=[];items.forEach(it=>all.push([it,0]));for(let k=0;k<126;k++)all.push([items[k%42],1]);
all.forEach(([it,deco])=>{const b=document.createElement('button');b.className='cap'+(deco?' deco':'');if(deco)b.tabIndex=-1;b.innerHTML='<i></i><i></i>';
 b.setAttribute('aria-label',`第${it.id}条：${it.short}`);field.appendChild(b);
 const c={el:b,it,x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*.25,vy:(rnd()-.5)*.25,r:rnd()*360,vr:(rnd()-.5)*.12,s:deco?.6+rnd()*.6:.85+rnd()*.45,hover:false};caps.push(c);
 b.addEventListener('mouseenter',()=>{c.hover=true;tip.innerHTML=`<b>${it.id}</b>${esc(it.short)}`;tip.style.opacity=1;});
 b.addEventListener('mouseleave',()=>{c.hover=false;tip.style.opacity=0;});
 b.addEventListener('focus',()=>b.dispatchEvent(new Event('mouseenter')));b.addEventListener('blur',()=>b.dispatchEvent(new Event('mouseleave')));
 b.addEventListener('click',()=>{b.classList.add('open');tip.style.opacity=0;setTimeout(()=>{openCard(it.id);setTimeout(()=>b.classList.remove('open'),400)},480);});
});
let mx=-1e4,my=-1e4;hero.addEventListener('mousemove',e=>{const r=hero.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
hero.addEventListener('mouseleave',()=>{mx=my=-1e4});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){caps.forEach(c=>{
 if(!c.hover&&!reduce){const dx=c.x-mx,dy=c.y-my,d2=dx*dx+dy*dy;
  if(d2<14000){const f=.6/Math.sqrt(d2+1);c.vx+=dx*f*.05;c.vy+=dy*f*.05;}
  c.vx*=.995;c.vy*=.995;const sp=Math.hypot(c.vx,c.vy);if(sp<.12){c.vx*=1.02;c.vy*=1.02}if(sp>1.2){c.vx*=.9;c.vy*=.9}
  c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;
  if(c.x<-40)c.x=W+30;if(c.x>W+40)c.x=-30;if(c.y<-30)c.y=H+20;if(c.y>H+30)c.y=-20;}
 const sc=c.hover?c.s*1.35:c.s;c.el.style.transform=`translate(${c.x}px,${c.y}px) rotate(${c.r}deg) scale(${sc})`;
 if(c.hover){tip.style.left=c.x+(c.el.offsetWidth/2)+'px';tip.style.top=c.y+'px';}
});requestAnimationFrame(tick);}tick();

/* modal */
const modal=$('#modal'),card=$('#card');let lastFocus;
function openCard(id){const it=items.find(i=>i.id===id);lastFocus=document.activeElement;
 card.innerHTML=`<header><div><div class="meta">第 ${it.id} 条 · ${esc(it.cat)} · ${stB(it.status)}</div><h2 id="mTitle">${esc(it.short)}</h2></div><button class="close" data-close aria-label="关闭">×</button></header>
 <div class="cols">
  <section class="col now"><h3>今日现象 ${evB(it.evNow)}</h3><p class="big">${esc(it.now)}</p>
   ${it.evNowText?`<div class="ev"><span class="lab">证据摘句</span>${esc(it.evNowText)}</div>`:''}${link(it.nowSrc)}</section>
  <section class="col past"><h3>历史押韵 ${evB(it.evPast)}</h3><p class="big">${esc(it.past)}</p>
   <dl><dt>时间地点</dt><dd>${esc(it.when)}</dd><dt>经过</dt><dd>${esc(it.story)}</dd><dt>结局</dt><dd>${esc(it.end)}</dd></dl>
   ${it.evPastText?`<div class="ev"><span class="lab">证据摘句</span>${esc(it.evPastText)}</div>`:''}${link(it.pastSrc)}</section>
 </div>
 <div class="compare"><div><h4>相似</h4><p>${esc(it.same)}</p></div><div><h4>不同</h4><p>${esc(it.diff)}</p></div><div class="lesson"><h4>启示</h4><p>${esc(it.lesson)}</p></div></div>
 ${it.note?`<div class="note">待核实：${esc(it.note)}</div>`:''}`;
 modal.hidden=false;document.body.style.overflow='hidden';card.querySelector('.close').focus();}
function closeCard(){modal.hidden=true;document.body.style.overflow='';lastFocus&&lastFocus.focus();}
modal.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeCard();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeCard();});
window.openCard=openCard;

/* timeline */
const groups=$('#groups'),filters=$('#filters');
groups.innerHTML=D.cats.map(cat=>{const list=items.filter(i=>i.cat===cat);
 return `<div class="group" data-cat="${esc(cat)}"><h3 class="reveal">${esc(cat)}<small>${list.length} 组对照</small></h3><div class="rows">${list.map(it=>`
 <div class="row reveal" data-id="${it.id}">
  <div class="side now" tabindex="0" role="button" aria-expanded="false"><div class="t">${esc(it.now)}</div><div class="m">${evB(it.evNow)} ${stB(it.status)}</div><div class="tg"></div><dl class="x"><dt>证据强度</dt><dd>${esc(it.evNow)}（核实：${esc(it.status)}）</dd>${it.evNowText?`<dt>证据摘句</dt><dd>${esc(it.evNowText)}</dd>`:""}<dt>来源</dt><dd><a href="${esc(it.nowSrc)}" target="_blank" rel="noopener">${esc(it.nowSrc)}</a></dd><dt>相似 / 不同</dt><dd>${esc(it.same)} / ${esc(it.diff)}</dd><dt>启示</dt><dd>${esc(it.lesson)}</dd></dl></div>
  <div class="node" title="打开完整对照卡片">${it.id}</div>
  <div class="side past" tabindex="0" role="button" aria-expanded="false"><div class="t">${esc(it.past)}</div><div class="m">${esc(it.when)} ${evB(it.evPast)}</div><div class="tg"></div><dl class="x"><dt>时间地点</dt><dd>${esc(it.when)}</dd><dt>经过</dt><dd>${esc(it.story)}</dd><dt>结局</dt><dd>${esc(it.end)}</dd><dt>证据强度</dt><dd>${esc(it.evPast)}</dd>${it.evPastText?`<dt>证据摘句</dt><dd>${esc(it.evPastText)}</dd>`:""}<dt>来源</dt><dd><a href="${esc(it.pastSrc)}" target="_blank" rel="noopener">${esc(it.pastSrc)}</a></dd></dl></div>
 </div>`).join('')}</div></div>`}).join('');
const tog=s=>{s.classList.toggle('ex');s.setAttribute('aria-expanded',s.classList.contains('ex'));};
groups.addEventListener('click',e=>{if(e.target.closest('a'))return;const n=e.target.closest('.node');if(n){openCard(+n.closest('.row').dataset.id);return;}const s=e.target.closest('.side');if(s&&!e.target.closest('.x'))tog(s);});
groups.addEventListener('keydown',e=>{const s=e.target.closest('.side');if(s&&e.target===s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tog(s);}});
filters.innerHTML=['全部',...D.cats].map((c,i)=>`<button class="${i?'':'on'}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 filters.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 groups.querySelectorAll('.group').forEach(g=>{g.hidden=!(b.dataset.c==='全部'||g.dataset.cat===b.dataset.c);});});

/* laws & method */
$('#lawList').innerHTML=D.laws.map(l=>`<li class="reveal"><h4>${esc(l.title)}</h4><p>${esc(l.detail)}</p></li>`).join('');
$('#quote').innerHTML=`${esc(D.quote.text)}<cite>${esc(D.quote.cite)}</cite>`;
$('#methodText').innerHTML=D.method.map(t=>`<p>${esc(t)}</p>`).join('');

/* reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
})();

</script>
</body>
</html>
