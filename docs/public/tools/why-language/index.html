石",text:"你输入了一句话，然后我们这些话会被拆分掉，会变成数据向量化……去预测下一个词。",src:"新春 AI 工作坊（第一课）00:59:14",flag:Rn},csNat:{side:"cs",who:"陈石",text:"自然语言，它有高度的不确定性，然后他有很大的解释空间。",src:"四明山法师 AI 夜校第三期先导课 00:20:02",flag:Rn},csTime:{side:"cs",who:"陈石",text:"它是基于人类有史以来所有有形载体记载的这些自然语言形成的一些语料……所以他是把时间的这个维度给消失掉的。",src:"《大模型时代：三期叠加历史定位》实验班 [03:55–04:52]",flag:Rn},csEgg:{side:"cs",who:"陈石",text:"你碰到一个鸡蛋，你把它拿起来也不会捏碎……对于具身智能来讲，它就很难做到这一点。",src:"新春 AI 工作坊（第五节）00:17:47",flag:Rn},csSay:{side:"cs",who:"陈石",text:"讲不出来的判断，严格说还不完全属于你。",src:"《好好说话：AI 时代，律师的主场在语言》",flag:Rn},csAsk:{side:"cs",who:"陈石",text:"你用什么语言提问，就活在什么答案里。",src:"《好好说话：AI 时代，律师的主场在语言》"}},V="#5CE1E6",We="#FF7A59",Tu="#9B8CFF",$="#D9B25C",re="'Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC',serif",K="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif",Te="'SF Mono',Menlo,Consolas,monospace",Sf=e=>e==="pro"?V:e==="con"?We:e==="cs"?$:Tu,n0=e=>e==="pro"?"正方":e==="con"?"反方":e==="cs"?"陈石":"中间",r0=`
