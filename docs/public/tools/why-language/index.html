-agent"],note:"本段未下载片段，未经本地转写核对"},{id:"bender",who:"Bender & Koller",ph:"bender",side:"con",kind:"论文",st:"已核实",zh:"意义无法只从形式中学到。我们把（语言的）意义理解为语言形式与交流意图之间的关系。",en:"We take (linguistic) meaning to be the relation between a linguistic form and communicative intent. … meaning cannot be learned from form alone.",work:"Climbing towards NLU: On Meaning, Form, and Understanding in the Age of Data，ACL 2020",year:"2020",loc:"第 1、4 节（章鱼思想实验在 PDF 第 5 页）",link:"https://aclanthology.org/2020.acl-main.463.pdf",linkName:"ACL Anthology（CC BY 4.0）",note:"章鱼思想实验：章鱼 O 窃听两座荒岛之间的海底电缆，学会了模仿英语对话，但当一方遇到熊、求助造武器时，它无从回答",media:[{k:"paper",f:"paper-bender",cap:"章鱼思想实验段落，高亮处为原文"}]},{id:"parrot",who:"Bender、Gebru 等",ph:"bender",side:"con",kind:"论文",st:"已核实",zh:"语言模型是一个系统：它依据语言形式如何组合的概率信息，把在海量训练数据里见过的语言形式胡乱拼接起来，却不涉及任何意义——一只随机鹦鹉。",en:"an LM is a system for haphazardly stitching together sequences of linguistic forms it has observed in its vast training data, according to probabilistic information about how they combine, but without any reference to meaning: a stochastic parrot.",work:"On the Dangers of Stochastic Parrots: Can Language Models Be Too Big?，FAccT ’21，DOI 10.1145/3442188.3445922",year:"2021",loc:"第 6.1 节（PDF 第 8 页）",link:"https://s10251.pcdn.co/pdf/2021-bender-parrots.pdf",linkName:"作者团队公开镜像 PDF",alt:["https://doi.org/10.1145/3442188.3445922"],media:[{k:"paper",f:"paper-parrots",cap:"原文页面，高亮处为引文"}]},{id:"searle",who:"Searle",ph:"searle",side:"con",kind:"论文",st:"已核实",flag:"原刊页码待核实",zh:"（关在屋里、照规则手册摆弄中文符号的我）一个中文字也不懂。——执行程序，不足以产生理解。",en:"I do not understand a word of the Chinese…",enNote:"原文片段；破折号后为编者概括",work:"Minds, Brains, and Programs，Behavioral and Brain Sciences 3(3): 417–457",year:"1980",loc:"PDF 第 2 页（原刊约第 418 页，待核实）",link:"https://zoo.cs.yale.edu/classes/cs458/materials/minds-brains-and-programs.pdf",linkName:"耶鲁课程镜像（BBS 原刊扫描版）",media:[{k:"paper",f:"paper-searle",cap:"中文屋段落，高亮处为原文"}]},{id:"chomsky",who:"乔姆斯基等",ph:"chomsky",side:"con",kind:"报刊文章",st:"已核实",zh:"人类心智不像 ChatGPT 之流，是一台笨重的模式匹配统计引擎，吞下数百 TB 数据，外推出最可能的回答；恰恰相反，它是一个出奇高效、甚至优雅的系统，靠少量信息运转——它寻求的不是数据点之间的粗糙相关，而是解释。",en:"The human mind is not, like ChatGPT and its ilk, a lumbering statistical engine for pattern matching, gorging on hundreds of terabytes of data and extrapolating the most likely conversational response or most probable answer to a scientific question. On the contrary, the human mind is a surprisingly efficient and even elegant system that operates with small amounts of information; it seeks not to infer brute correlations among data points but to create explanations.",work:"Noam Chomsky、Ian Roberts、Jeffrey Watumull：The False Promise of ChatGPT，《纽约时报》客座评论",year:"2023-03-08",link:"https://www.nytimes.com/2023/03/08/opinion/noam-chomsky-chatgpt-ai.html",linkName:"《纽约时报》原文（付费墙）",alt:["https://archive.ph/cLNwI"],note:"原网页有付费墙；2026-11-02 经 archive.ph 存档页比对英文原句"},{id:"chomsky2",who:"乔姆斯基等",ph:"chomsky",side:"con",kind:"报刊文章",st:"已核实",zh:"它们最深的缺陷，是缺少任何智能最关键的能力：不仅说出是什么、曾是什么、将是什么，还要说出不是什么、可能是什么、不可能是什么。那才是解释的成分，真正智能的标志。",en:"Their deepest flaw is the absence of the most critical capacity of any intelligence: to say not only what is the case, what was the case and what will be the case — that’s description and prediction — but also what is not the case and what could and could not be the case. Those are the ingredients of explanation, the mark of true intelligence.",work:"The False Promise of ChatGPT，《纽约时报》",year:"2023-03-08",link:"https://www.nytimes.com/2023/03/08/opinion/noam-chomsky-chatgpt-ai.html",linkName:"《纽约时报》原文（付费墙）",alt:["https://archive.ph/cLNwI"],note:"经 archive.ph 存档页比对"},{id:"chiang",who:"Ted Chiang",ph:"chiang",side:"con",kind:"报刊文章",st:"已核实",zh:"把 ChatGPT 想成网上全部文字的一张模糊 JPEG。它保留了大部分信息，但你要找一串精确的比特，是找不到的；你得到的永远只是近似。",en:"Think of ChatGPT as a blurry JPEG of all the text on the Web. It retains much of the information on the Web, in the same way that a JPEG retains much of the information of a higher-resolution image, but, if you’re looking for an exact sequence of bits, you won’t find it; all you will ever get is an approximation.",work:"ChatGPT Is a Blurry JPEG of the Web，《纽约客》",year:"2023-02-09",link:"https://www.newyorker.com/tech/annals-of-technology/chatgpt-is-a-blurry-jpeg-of-the-web",linkName:"《纽约客》原文",alt:["https://archive.is/kEdyu"],note:"经存档页比对英文原句"},{id:"turing",who:"图灵",ph:"turing",side:"tool",kind:"论文",st:"已核实",zh:"我提议来考虑这个问题：“机器能思考吗？”",en:"I propose to consider the question, “Can machines think?”",work:"Computing Machinery and Intelligence，Mind 59(236)",year:"1950",loc:"第 433 页首句",link:"https://redirect.cs.umbc.edu/courses/471/papers/turing.pdf",linkName:"UMBC 课程镜像 PDF",note:"此镜像标卷号 49，原刊为 LIX(59) 卷，以原刊为准",media:[{k:"paper",f:"paper-turing",cap:"原文页面，高亮处为引文",box:[.144,.251,.605,.268]}]},{id:"csTime",who:"陈石",side:"cs",kind:"陈石课程与文章",st:"待核实",flag:"原话待核实",zh:"它是基于人类有史以来所有有形载体记载的这些自然语言形成的一些语料……所以他是把时间的这个维度给消失掉的。",work:"《大模型时代：三期叠加历史定位》实验班逐字稿",year:"2026",loc:"[03:55–04:52]",note:"出自本人课程逐字稿（自动转写），措辞待本人确认"},{id:"csNat",who:"陈石",side:"cs",kind:"陈石课程与文章",st:"待核实",flag:"原话待核实",zh:"自然语言，它有高度的不确定性，然后他有很大的解释空间。",work:"四明山法师 AI 夜校第三期先导课逐字稿",year:"2026-07-26",loc:"00:20:02",note:"出自本人课程逐字稿（自动转写），措辞待本人确认"},{id:"lecun1",who:"Browning & 杨立昆",ph:"lecun",side:"limit",kind:"报刊文章",st:"已核实",zh:"语言是一种带宽很低的信息传递方式：孤立的词句一旦脱离语境，传达的东西很少。",en:"Language is a very low-bandwidth method for transmitting information: isolated words or sentences, shorn of context, convey little.",work:"Jacob Browning、Yann LeCun：AI and the Limits of Language，Noema",year:"2022-08-23",link:od,linkName:"Noema 原文",note:"2026-11-02 重新打开原文核对"},{id:"lecun2",who:"Browning & 杨立昆",ph:"lecun",side:"limit",kind:"报刊文章",st:"已核实",zh:"一个只用语言训练的系统，即使从现在训练到宇宙热寂，也永远无法接近人类智能。",en:"A system trained on language alone will never approximate human intelligence, even if trained from now until the heat death of the universe.",work:"AI and the Limits of Language，Noema",year:"2022-08-23",link:od,linkName:"Noema 原文",note:"2026-11-02 重新打开原文核对"},{id:"fed",who:"Fedorenko、Piantadosi、Gibson",side:"limit",kind:"论文",st:"已核实",zh:"在现代人身上，语言是交流的工具——这与“我们用语言来思考”的流行看法相反。语言似乎并不是复杂思维（包括符号思维）的前提。",en:"…in modern humans, language is a tool for communication, contrary to a prominent view that we use language for thinking. … language does not appear to be a prerequisite for complex thought, including symbolic thought.",work:"Language is primarily a tool for communication rather than thought，Nature 630: 575–586，DOI 10.1038/s41586-024-07522-w",year:"2024-06-19",loc:"摘要",link:"https://www.nature.com/articles/s41586-024-07522-w",linkName:"Nature 原文",alt:["https://mcgovern.mit.edu/wp-content/uploads/2024/08/s41586-024-07522-w.pdf"],note:"证据之一：失语症患者在语言能力严重受损时，仍能完成多种推理任务（见正文 Box 与综述部分）"},{id:"wit411",who:"维特根斯坦",ph:"wittgenstein",side:"limit",kind:"书籍",st:"已核实",zh:"真命题的总和就是全部自然科学。",en:"The totality of true propositions is the total natural science (or the totality of the natural sciences).",enNote:"Ogden 英译本",work:"《逻辑哲学论》",year:"1921/1922",loc:"命题 4.11",link:"https://www.gutenberg.org/ebooks/5740",linkName:"Project Gutenberg（Ogden 译本）"},{id:"wit7",who:"维特根斯坦",ph:"wittgenstein",side:"limit",kind:"书籍",st:"待核实",flag:"本页未逐字核对英译",zh:"对于不可说的东西，必须保持沉默。",en:"Wovon man nicht sprechen kann, darüber muß man schweigen.",enNote:"德文原句（常见引法）",work:"《逻辑哲学论》",year:"1921/1922",loc:"命题 7",link:"https://www.gutenberg.org/ebooks/5740",linkName:"Project Gutenberg（Ogden 译本）"},{id:"dao",who:"《道德经》",side:"limit",kind:"书籍",st:"已核实",zh:"道可道，非常道。名可名，非常名。",work:"《道德经》（通行本）",year:"先秦",loc:"第一章",link:"https://ctext.org/dao-de-jing/zh",linkName:"中国哲学书电子化计划",note:"通行本文字；帛书本作“道可道也，非恒道也”"},{id:"csEgg",who:"陈石",side:"cs",kind:"陈石课程与文章",st:"待核实",flag:"原话待核实",zh:"你碰到一个鸡蛋，你把它拿起来也不会捏碎……对于具身智能来讲，它就很难做到这一点。",work:"新春 AI 工作坊（第五节）逐字稿",year:"2026",loc:"00:17:47–00:18:32",note:"出自本人课程逐字稿（自动转写），措辞待本人确认"},{id:"hrIntim",who:"赫拉利",ph:"harari",side:"civ",kind:"讲座",st:"机器转写",zh:"随着 AI 掌握语言，它接管的可能不只是官僚制，在某种程度上还有人际关系。……战线正在从注意力转向亲密关系。",en:"But as AI masters language, it might take over not just bureaucracy, but also to some extent personal re :root{color-scheme:dark}
html{scroll-behavior:smooth}
body{margin:0;background:#06070a;color:#E9E6DF;font-family:${Kt};-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:${it}}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px;position:relative;z-index:2}
.sec{position:relative;padding:88px 0 72px;border-top:1px solid #1b1e26}
.panel{background:#0d0f14;border:1px solid #20242e;border-radius:14px}
.kick{font:600 12px/1 ${rt};letter-spacing:.18em;color:#8b8f99;text-transform:uppercase}
.h2{font:700 clamp(28px,3.6vw,44px)/1.2 ${K};margin:14px 0 10px;letter-spacing:.02em}
.lead{font-size:16px;line-height:1.85;color:#b9b6ae;max-width:820px}
.g{display:grid;gap:14px}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;cursor:pointer;padding:16px 16px 14px;background:#10131a;border:1px solid #232835;border-radius:12px;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s;position:relative;overflow:hidden}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c);background:#131722}
.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.85}
.qz{font:500 16px/1.75 ${K};color:#F1EEE6}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#9a9ea8;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 ${Kt};padding:4px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pt{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#222;filter:grayscale(.35)}
.mono{font-family:${rt}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.on{opacity:1;transform:none}
.fig{background:#0a0c11;border:1px solid #20242e;border-radius:12px;padding:14px;position:relative;overflow:hidden}
.figcap{font-size:12px;color:#8b8f99;margin-top:8px;line-height:1.6}
.demo{font:600 10px/1 ${rt};color:#6f7480;letter-spacing:.12em;position:absolute;right:12px;top:12px}
.nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(6,7,10,.86);backdrop-filter:blur(10px);border-bottom:1px solid #1b1e26;transform:translateY(-100%);transition:transform .4s}
.nav.on{transform:none}
.nav a{color:#9a9ea8;text-decoration:none;font-size:13px;padding:14px 10px;display:inline-block;white-space:nowrap}
.nav a.cur{color:#fff;box-shadow:inset 0 -2px 0 ${Y}}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.side3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fact{border-left:2px solid #2a2f3b;padding:2px 0 2px 12px;font-size:13px;line-height:1.7;color:#b9b6ae}
.fact b{display:block;font:700 22px/1.2 ${K};color:#fff}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes driftR{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes brick{0%{opacity:0;transform:translateY(-60px) rotate(-4deg)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.modalbg{position:fixed;inset:0;z-index:50;background:rgba(3,4,6,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .25s}
@keyframes fi{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.98)}}
.modal{width:min(880px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#0e1016;border:1px solid #2a2f3b;border-radius:16px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid #1c2029;font-size:13.5px;line-height:1.7}
.row>span:first-child{color:#7f8490}
table.ix{width:100%;border-collapse:collapse;font-size:13px}
table.ix td,table.ix th{padding:10px 8px;border-top:1px solid #1c2029;text-align:left;vertical-align:top;line-height:1.6}
table.ix th{color:#7f8490;font-weight:600;position:sticky;top:46px;background:#0d0f14}
table.ix tr{cursor:pointer}
table.ix tbody tr:hover{background:#131722}
.fbtn{all:unset;cursor:pointer;font-size:12.5px;padding:6px 10px;border:1px solid #2a2f3b;border-radius:999px;color:#b9b6ae}
.fbtn.on{background:#E9E6DF;color:#0b0c10;border-color:#E9E6DF}
@media (max-width:820px){
 .wrap{padding:0 16px}.sec{padding:64px 0 52px}
 .side2,.side3{grid-template-columns:1fr}
 .row{grid-template-columns:76px 1fr}
 .hideM{display:none}
 table.ix th{top:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
